<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="style.css">
    <style>
        h1{
            text-align: center;
            color:black;
        }
        label{
            padding-left: 20px;
            font-size: 18px;
        }
        input[type="text"], input[type="number"] {
            width: 50%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        input[type="submit"], input[type="reset"] {
            background-color: #880808;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 20px;
        }
        input[type="submit"]:hover, input[type="reset"]:hover {
            background-color: rgb(128, 0, 0);
        }
    </style>
</head>
<body>
    <div id="header" style="background-color: #880808; color:azure ; font-size:large;text-align: center; margin:0;padding:0;"><h3>Welcome to the Raktkosh portal!</h3></div>
    <div id="f_div">
        <img id="blood_bank" src="blood_bank.png" height="65">
        <div id="s_div">
        <h2> Raktkosh</h2>
        <p>Connecting Donors with Lives in Need</p>
    </div>
    </div>
    <nav>
        <a href="#">Home</a>
        <a href="#about_us">About us</a>
        <a href="Sign_in">Sign In</a>
        <a href="registration.html">Want to donate</a>
        <a href="check_blood_availability">Check blood availability</a>
    </nav>
    <h1 style="text-align: center; color:hsl(0, 0%, 0%); ">Donor Details</h1>
    <label>Name:</label>
    <input type="text" ><br>
    <label>Mobile no:</label>
    <input type="number" maxlength="10"><br>
    <label>Gender:</label>
    <input type="radio" name="r1" value="Male">M
    <input type="radio" name="r1" value="female">F<br>
    <label>Blood group:</label>
    <input type="text"><br>
    <input type="submit" value="Submit">
    <input type="reset" value="clear">
</body>
</html>
